name: Render Keep Alive Cron Job

on:
  schedule:
    # Runs every 10 minutes to keep Render free tier service awake (15-min idle limit)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Health Check Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$RENDER_BACKEND_URL" ]; then
            echo "Error: RENDER_BACKEND_URL secret is not set in GitHub repository secrets!"
            echo "Please add RENDER_BACKEND_URL under Settings -> Secrets and variables -> Actions in your repository."
            exit 1
          fi
          
          TARGET_URL="$RENDER_BACKEND_URL"
          TARGET_URL="${TARGET_URL%/}"
          
          MAX_RETRIES=3
          TIMEOUT=90
          RETRY_DELAY=15
          
          echo "Pinging healthz endpoint at: ${TARGET_URL}/healthz (max ${MAX_RETRIES} attempts, ${TIMEOUT}s timeout)..."
          
          SUCCESS=0
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt of $MAX_RETRIES..."
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time "$TIMEOUT" "${TARGET_URL}/healthz" || echo "000")
            echo "HTTP Response Status Code: ${STATUS_CODE}"
            
            if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
              echo "Success: Render service is active and responsive."
              SUCCESS=1
              break
            else
              echo "Attempt $attempt failed (Status: ${STATUS_CODE}). Waiting ${RETRY_DELAY}s for server to warm up..."
              sleep $RETRY_DELAY
            fi
          done
          
          if [ $SUCCESS -ne 1 ]; then
            echo "Error: Render service failed to respond with HTTP 2xx after ${MAX_RETRIES} attempts."
            exit 1
          fi
