[project]
name = "hyperlocal-chat-backend"
version = "0.1.0"
description = "Hyperlocal location-gated chat backend (FastAPI + PostGIS + WebSockets)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "geoalchemy2>=0.15.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pygeohash>=1.2",
    "shapely>=2.0",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "email-validator>=2.2",
]

[tool.uv]
package = false
